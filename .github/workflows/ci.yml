name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Host (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  ble-helper:
    name: BLE helper
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            firmware/go.sum
            host/ble-helper/go.sum
      - name: Test BLE helper
        working-directory: host/ble-helper
        run: go test ./...
